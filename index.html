<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Xem Phim - AniStream</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: #121212; color: #fff; }

        .topbar {
            height: 60px; width: 100%; position: fixed; top: 0; left: 0;
            background-color: #1f1f1f; display: flex; align-items: center;
            padding: 0 20px; z-index: 1000; border-bottom: 1px solid #333;
        }
        .logo { font-size: 22px; font-weight: bold; color: #ff4757; text-decoration: none; }
        .logo span { color: #fff; }

        .watch-container {
            margin-top: 60px; padding: 20px; max-width: 1200px; margin-left: auto; margin-right: auto;
        }

        /* Player khung xem phim responsive */
        .video-player {
            width: 100%; aspect-ratio: 16 / 9; background-color: #000;
            border-radius: 8px; overflow: hidden; margin-bottom: 20px;
        }
        .video-player iframe { width: 100%; height: 100%; border: none; }

        .movie-details { background: #1f1f1f; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .movie-title { font-size: 24px; color: #ff4757; margin-bottom: 10px; }
        .movie-meta { font-size: 14px; color: #aaa; margin-bottom: 15px; }

        /* Chọn Tập Phim */
        .episodes-section { background: #1f1f1f; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .episodes-section h3 { margin-bottom: 15px; font-size: 18px; }
        .ep-list { display: flex; flex-wrap: wrap; gap: 10px; }
        .ep-btn {
            padding: 8px 16px; background: #2b2b2b; color: #fff;
            text-decoration: none; border-radius: 4px; font-size: 14px;
        }
        .ep-btn:hover, .ep-btn.active { background: #ff4757; }

        /* Bình luận */
        .comment-section { background: #1f1f1f; padding: 20px; border-radius: 8px; }
        .comment-input { width: 100%; height: 80px; background: #2b2b2b; border: 1px solid #333; border-radius: 4px; color: #fff; padding: 10px; margin-top: 10px; resize: none; }
        .btn-submit { margin-top: 10px; padding: 8px 20px; background: #ff4757; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="topbar">
        <a href="#" class="logo">Ani<span>Stream</span></a>
    </div>

    <div class="watch-container">
        <!-- Khung Phát Video -->
        <div class="video-player">
            <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
        </div>

        <!-- Thông tin Phim -->
        <div class="movie-details">
            <h1 class="movie-title">Hành Trình Chuyển Sinh - Tập 12</h1>
            <div class="movie-meta">Năm phát hành: 2024 | Thể loại: Hành động, Phép thuật | Trạng thái: Hoàn thành</div>
            <p>Nội dung phim xoay quanh hành trình khám phá thế giới mới của nhân vật chính sau khi được chuyển sinh...</p>
        </div>

        <!-- Danh sách Tập -->
        <div class="episodes-section">
            <h3>Danh Sách Tập</h3>
            <div class="ep-list">
                <a href="#" class="ep-btn">Tập 1</a>
                <a href="#" class="ep-btn">Tập 2</a>
                <a href="#" class="ep-btn">Tập 3</a>
                <a href="#" class="ep-btn active">Tập 12</a>
            </div>
        </div>

        <!-- Bình luận -->
        <div class="comment-section">
            <h3>Bình luận</h3>
            <textarea class="comment-input" placeholder="Viết bình luận của bạn..."></textarea>
            <button class="btn-submit">Gửi bình luận</button>
        </div>
    </div>

</body>
</html>
